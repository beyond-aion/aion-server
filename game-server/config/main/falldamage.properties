#
# ----------------------------
# Fall damage config's:
# ----------------------------

# The damage percentage of max HP per meter.
# Default: 1.0 (%)
gameserver.falldamage.percentage = 1.0

# Flat damage per meter, added to the percentage.
# Default: 4
gameserver.falldamage.flat = 4

# Fall height above which you take damage when you hit the ground.
# Default: 10 (meter)
gameserver.falldamage.distance.minimum = 10

# Fall height from which you die when you hit the ground.
# Default: 50 (meter)
gameserver.falldamage.distance.maximum = 50

# Fall height above which you die in mid air if there is no ground to stand on within twice that height below you.
# Default: 50 (meter)
gameserver.falldamage.distance.midair = 50

# Same as above, but in fly zones.
# Default: 100 (meter)
gameserver.falldamage.distance.midair.fly_zone = 100
