# Shutdown delay in seconds for regular shutdowns, as well as restarts.
# Default: 120
gameserver.shutdown.delay = 120

# Shut down instantly if there are no other players online except staff.
# Default: true
gameserver.shutdown.instant_shutdown_with_only_staff_online = true

# Cron schedule which triggers an automatic server restart (daily 5 AM = 0 0 5 ? * *, every wednesday 5 AM = 0 0 5 ? * WED).
# Default: empty (= disabled)
gameserver.shutdown.restart_schedule = 