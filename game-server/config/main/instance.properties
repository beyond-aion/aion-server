#
# ----------------------------
# Instance configs:
# ----------------------------

# It's how many times the cooldown will be shorter
# Example: 3 = 1/3 of retail cooldown, 0 - disable cooldown
# Default: 1
gameserver.instance.cooldown_rate = 1

# List of instance map IDs, which should not be affected by the customized cooldown rate
# Default: empty
# Example: 300080000,300090000,300060000
gameserver.instance.cooldown_rate.excluded_maps =

# Time in seconds until an empty instance will be destroyed
# Default: 600 (10 minutes)
gameserver.instance.destroy_delay_seconds = 600

# Time in seconds until an empty solo instance will be destroyed
# Default: 600 (10 minutes)
gameserver.instance.solo.destroy_delay_seconds = 600

# Duel in Instance
# Default: true
gameserver.instance.duel.enable = true

# ----------------------------
# Instance Difficulty Scaling
# ----------------------------

# Enable difficulty scaling based on the maximum number of players seen in the instance. Players leaving the instance are ignored to prevent abuse.
# Default: false
gameserver.instance.scaling.enable = false

# Maximum allowed level difference between the player level and the minimum instance entry level. If a player's level exceeds the instance's min.
# entry level by more than this value, the instance will no longer be scaled.
# Example: A level 50 instance with a max. level difference of 5 will be scaled as long as all players are level 55 or below.
# Default: 5
gameserver.instance.scaling.max_level_diff = 5

# Minimum NPC rating to be affected by scaling. NPCs with a rating below this value will not be scaled.
# Possible values: JUNK, NORMAL, ELITE, HERO, LEGENDARY
# Default: ELITE
gameserver.instance.scaling.npc_min_rating = ELITE

# Adjustment factor for NPC HP scaling
# This value controls how much NPC health is reduced for each missing player in the instance. A smaller number means less aggressive scaling.
# It is recommended to keep the value below 1.0 to incentivize group play.
# Default: 0.75
gameserver.instance.scaling.hp_scale_factor = 0.75

# Minimum HP multiplier (e.g. 0.5 = NPCs never drop below 50% of their base HP)
# Default: 0.5
gameserver.instance.scaling.hp_floor = 0.5

# Adjustment factor for NPC damage scaling
# This value controls how much NPC damage is reduced for each missing player in the instance. A smaller number means less aggressive scaling.
# It is recommended to keep the value below 1.0 to incentivize group play.
# Default: 0.5
gameserver.instance.scaling.dmg_scale_factor = 0.5

# Minimum damage multiplier
# Default: 0.75
gameserver.instance.scaling.dmg_floor = 0.75

# Instance map IDs excluded from instance scaling
gameserver.instance.scaling.excluded_maps =

# Location of instance *.java handlers
gameserver.instance.handler_directory = ./data/handlers/instance