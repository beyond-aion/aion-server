#
# ----------------------------
# Network Config's:
# ----------------------------

# Address where Aion clients will attempt to connect to (format is host:port).
# The host part can be an IPv4 address or a host/domain name which resolves to an IPv4 address since the client does not support IPv6.
# By default, the connect address is the same as the socket address (if the host part is set to 0.0.0.0 the server will auto select the most suitable local
# IPv4 address and log it).
chatserver.network.client.connect_address = ${chatserver.network.client.socket_address}

# Local address where CS will listen for Aion client connections (0.0.0.0 = bind any local IP)
chatserver.network.client.socket_address = 0.0.0.0:10241

# Local address where CS will listen for GS connections (0.0.0.0 = bind any local IP)
chatserver.network.gameserver.socket_address = 0.0.0.0:9021

# Password to match for successful authentication of the game server
# NOTE: Don't forget to add your password!
chatserver.network.gameserver.password =

# Socket transport of the network threads
# AUTO - epoll on Linux, NIO elsewhere
# IO_URING / EPOLL / NIO - this transport only, the server fails to start if it is unavailable
# io_uring is not part of AUTO, since it is still relatively new. Docker's default seccomp profile blocks it and many hosts disable it
# for security reasons (kernel.io_uring_disabled).
# Default: AUTO
chatserver.network.transport = AUTO

# Number of extra threads dedicated only to read/write network data.
# Value < 1 means that acceptor thread will also handle read & write.
# Value > 0 means there will be x dedicated read/write threads + 1 acceptor.
chatserver.network.io_threads = 1

# Time in seconds a client has to authenticate after connecting, before it gets disconnected.
chatserver.network.client.auth_timeout_seconds = 60

# Limits of the client connections of each IP. Rejected connections are closed right after the accept, and logged at most once a minute per IP.
# Behind a proxy that hides the clients' IPs (all connections come from the proxy), set the limits to 0.
# Connections an IP may have open at the same time, 0 for no limit.
# Default: 200
chatserver.network.client.max_connections_per_ip = 200
# New connections an IP may open per second on average, after a burst of connection_burst_per_ip, 0 for no limit. Reconnecting doesn't reset it.
# Default: 5
chatserver.network.client.connections_per_second_per_ip = 5
# Default: 30
chatserver.network.client.connection_burst_per_ip = 30
